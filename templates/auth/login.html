{% extends 'base.html' %}

{% block title %}Log In - InternHub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8">
            <div class="app-card p-4 p-md-5 bg-white shadow-lg border-0">
                <div class="text-center mb-4">
                    <h3 class="fw-bold mb-1">Welcome to InternHub</h3>
                    <p class="text-muted small">Log in to your account</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Email Address</label>
                        <input type="email" id="loginEmail" name="email" class="form-control" required placeholder="name@domain.com">
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Password</label>
                        <input type="password" id="loginPassword" name="password" class="form-control" required placeholder="••••••••">
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold">
                            Sign In
                        </button>
                    </div>

                    <div class="text-center small text-muted">
                        Don't have an account? 
                        <a href="{{ url_for('register_student') }}" class="text-primary fw-semibold">Student Sign Up</a> or 
                        <a href="{{ url_for('register_company') }}" class="text-primary fw-semibold">Employer Sign Up</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
